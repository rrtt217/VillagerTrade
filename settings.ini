; VillagerTrade 插件配置
; 修改后需重载插件（控制台 reload_plugin VillagerTrade）
; 注意：键名两侧不要加空格，Cuberite 的 INI 解析会把空格算进键名

[Features]
; 村民刷怪蛋合成配方：1 绿宝石 + 1 鸡蛋 = 1 村民刷怪蛋
EnableVillagerSpawnEggCrafting=1

; 把引擎内部职业（cVillager::m_Type）对齐为插件分配的虚拟职业。
; 引擎职业对玩家可见：1.8-1.12 协议会给客户端下发村民职业元数据（客户端按职业渲染外观），
; 同时它决定农夫 AI（种田/收割）与僵尸村民转化后的职业，因此建议保持开启。
; 对齐后交易内容与外观、AI 一致；关闭则村民外观与交易可能不符。
AlignRealProfession=1

; 村民使用可读英文名 "<Profession> <Name>"（如 "Butcher Bill"，重名加数字后缀）。
; 旧格式 "vt-<职业>-<随机码>" 会在村民被看到时自动迁移（重命名 + 数据键搬移 + 职业对齐），
; 首次迁移前会把 villager_data.txt 备份为 villager_data.txt.pre-migration.bak。
; 说明：引擎没有可持久化的实体 UUID，CustomName 是唯一持久键，所以名字必须保持唯一。
ReadableNames=1

[VillageLife]
; 村庄区块扫描：找出"含木门"的村庄区块，供铁傀儡守卫的"村庄生成"使用。
; 由 [IronGolem] EnableVillageGolemSpawning 自动开启或关闭，无需单独开关。
; 机制：区块首次加载时，若从未被扫描过且属于候选生物群系，就排队扫描一次；
;       已扫描标记持久化在 village_scanned.txt，服务器重启后不会重复扫描。
; 注意：以"木门"作为村庄特征，玩家自建的木门房也会被误判成村庄。
; （原先的"新村庄自动生成村民"已移除，计划迁到独立插件。）
; 每 tick 每个世界最多扫描多少个区块（把扫描开销摊到多个 tick，避免卡 tick）
ChunksPerTick=2
; 已扫描标记刷盘间隔（秒）
SaveIntervalSeconds=30

[IronGolem]
; 铁傀儡守卫（原型，默认关闭）。改成 1 后重载插件即可启用。
; 原理：cIronGolem 是 cAggressiveMonster，战斗 AI 齐全，但它是中性怪，
;       只有挨打才会锁定目标。插件用"伪造一次攻击"完成目标注入，
;       追击/寻路/攻击/冷却/难度伤害全部交给引擎。
EnableGuard=0
; 傀儡搜索敌对怪的半径（格）
GuardRadius=16
; 搜索间隔（tick）
CheckIntervalTicks=20
; 同一傀儡对同一目标的最短重复注入间隔（秒）
InjectCooldownSeconds=10
; 同一傀儡的全局最小注入间隔（秒）：人海战里换目标也不能绕开，防止无效注入/音效
MinInjectIntervalSeconds=2
; 注入后把模拟伤害 Heal 回去（净损失 0）
HealAfterInject=1
; 需要视线才注入
RequireLineOfSight=1
; 是否替傀儡下发追击路径（用引擎自己的 pathfinder）
PursueTarget=1
; 进入该距离停止追击，把最后一击交给引擎的 Attack()
PursueStopDistance=2
; 目标移动超过该距离才重新下发路径
PursueRefreshDistance=2

; 村庄铁傀儡生成（默认关闭）：**周期性、满足条件才生成**，扫描到区块时不会立刻生成。
; 每 VillageCheckSeconds 秒复查一次已扫描到的含门村庄区块，必须同时满足：
;   门数 >= MinDoorsInChunk
;   半径 VillageGolemRadius 内村民数 >= MinVillagers
;   半径内铁傀儡数 < MaxGolemsPerVillage
; 全部满足才在该村庄生成 1 只守卫。
; 注：严格的 1.12 是村庄级判定（门 > 20、傀儡数 < 村民数/10、每 tick 1/7000），
;     需要先把门聚合成村庄，留作后续；这里先用绝对阈值近似。
; VillageGolemRadius 必须大于村庄跨度（约 48~96 格），否则相邻区块互相看不到对方生成的
; 傀儡、上限形同虚设（实测 24 时一个村庄出了 5 只，48 时稳定 1~2 只）。
EnableVillageGolemSpawning=0
MinDoorsInChunk=2
MinVillagers=3
MaxGolemsPerVillage=2
VillageGolemRadius=64
VillageCheckSeconds=30
